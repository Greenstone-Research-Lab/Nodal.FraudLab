services:
  neo4j:
    image: neo4j:2026.07.1
    container_name: nodal-fraudlab-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/NodalLocal123!"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - fraudlab_neo4j_data:/data
      - fraudlab_neo4j_logs:/logs

volumes:
  fraudlab_neo4j_data:
  fraudlab_neo4j_logs:
